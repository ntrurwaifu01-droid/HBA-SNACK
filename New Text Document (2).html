<!DOCTYPE html>
<html>
<head>
    <title>Anime HBD</title>
    <style>
        body{
            margin:0;
            background: #000; /* 🔥 เปลี่ยนตรงนี้ */
            overflow:hidden;
            font-family: Arial;
            color:white;
            text-align:center;
        }

        .container{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
        }

        img{
            width:220px;
            border-radius:15px;
            box-shadow:0 0 30px #00ffff;
            opacity:0;
            transform: scale(0.8);
            animation: showImg 3s ease forwards;
        }

        @keyframes showImg{
            to{
                opacity:1;
                transform: scale(1);
            }
        }

        h1{
            font-size:60px;
            margin-top:20px;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip:text;
            color:transparent;
            opacity:0;
            animation: fadeIn 3s ease forwards 2s;
        }

        p{
            font-size:22px;
            opacity:0;
            animation: fadeIn 3s ease forwards 3.5s;
        }

        @keyframes fadeIn{
            to{opacity:1;}
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.postimg.cc/yN40br0d/AFFCE695-08A6-4706-97F0-E3A8714654CE.jpg">

    <h1>🎉 HBD NACK 🎂</h1>
    <p>ขอให้เป็นเด็กดีของเเม่เเละพ่อเเค่นั้นพอขี้เกียจล่ะ 🔥</p> 
</div>

</body>
</html>
